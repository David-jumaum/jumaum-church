name: Notify on content update
 
# sermons.html(설교노트) 또는 notices.html(교회소식)에 새 내용이 올라올 때만
# OneSignal을 통해 구독자 휴대폰에 푸시 알림을 보냅니다.
# styles.css, script.js, 이미지, 다른 페이지(index.html 등)만 바뀐 경우에는
# 이 두 파일이 diff에 잡히지 않으므로 알림이 가지 않습니다.
#
# 알림을 탭하면 바로 해당 페이지로 이동합니다: 설교노트만 바뀌었으면 sermons.html,
# 교회소식만 바뀌었으면 notices.html, 둘 다 바뀌었으면 홈페이지(jumaum.org)로 이동.
 
on:
  push:
    branches: [ main ]
 
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
 
      - name: Check which content files changed
        id: changes
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=$(git show --name-only --pretty="" HEAD)
          fi
          echo "changed files:"
          echo "$CHANGED"
          SERMON=false
          NOTICE=false
          if echo "$CHANGED" | grep -qx "sermons.html"; then SERMON=true; fi
          if echo "$CHANGED" | grep -qx "notices.html"; then NOTICE=true; fi
          echo "sermon=$SERMON" >> "$GITHUB_OUTPUT"
          echo "notice=$NOTICE" >> "$GITHUB_OUTPUT"
 
      - name: Build notification message
        if: steps.changes.outputs.sermon == 'true' || steps.changes.outputs.notice == 'true'
        id: msg
        run: |
          SERMON="${{ steps.changes.outputs.sermon }}"
          NOTICE="${{ steps.changes.outputs.notice }}"
          if [ "$SERMON" = "true" ] && [ "$NOTICE" = "true" ]; then
            TEXT="새 설교노트와 교회소식이 올라왔습니다. 지금 확인해보세요!"
            LINK="https://jumaum.org"
          elif [ "$SERMON" = "true" ]; then
            TEXT="새 설교노트가 올라왔습니다. 지금 확인해보세요!"
            LINK="https://jumaum.org/sermons.html"
          else
            TEXT="새 교회소식이 올라왔습니다. 지금 확인해보세요!"
            LINK="https://jumaum.org/notices.html"
          fi
          echo "text=$TEXT" >> "$GITHUB_OUTPUT"
          echo "link=$LINK" >> "$GITHUB_OUTPUT"
 
      - name: Send OneSignal push notification
        if: steps.changes.outputs.sermon == 'true' || steps.changes.outputs.notice == 'true'
        run: |
          curl -s -X POST "https://onesignal.com/api/v1/notifications" \
            -H "Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"app_id\": \"9d6defe9-1cdd-4ba0-8a83-15bf37add09f\",
              \"included_segments\": [\"Subscribed Users\"],
              \"headings\": {\"en\": \"주마음교회\", \"ko\": \"주마음교회\"},
              \"contents\": {\"en\": \"${{ steps.msg.outputs.text }}\", \"ko\": \"${{ steps.msg.outputs.text }}\"},
              \"url\": \"${{ steps.msg.outputs.link }}\"
            }"
